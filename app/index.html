<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="0; url=https://fenlanddavid.github.io/findspot/" />
  <link rel="canonical" href="https://fenlanddavid.github.io/findspot/" />
  <title>Opening FindSpot</title>
  <style>
    :root {
      --bg: #020617;
      --accent: #10b981;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, sans-serif;
      text-align: center;
      padding: 2rem;
    }

    a {
      color: var(--accent);
      font-weight: 800;
      text-decoration: none;
    }

    p {
      color: var(--muted);
      margin: 0.75rem 0 0;
    }
  </style>
</head>
<body>
  <main>
    <h1>Opening FindSpot</h1>
    <p><a href="https://fenlanddavid.github.io/findspot/">Open the app</a></p>
  </main>
  <script>
    window.location.replace('https://fenlanddavid.github.io/findspot/');
  </script>
</body>
</html>
